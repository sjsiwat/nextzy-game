openapi: 3.0.3
info:
  title: Nextzy Points Game API
  version: 1.0.0
  description: >
    Backend for the Nextzy points-collecting game. Scores are drawn on the
    server, so clients cannot set their own score. A player is identified by a
    UUID that the frontend generates and stores; the player row is created on
    the first play.
servers:
  - url: https://nextzy-game.onrender.com
    description: Production (Render)
  - url: http://localhost:3001
    description: Local development
tags:
  - name: Game
  - name: History
  - name: Health
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /players/{playerId}/summary:
    get:
      tags: [Game]
      summary: Get total score and checkpoint statuses
      description: Unknown players return 0 points. This endpoint never writes data.
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      responses:
        "200":
          description: Current summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
  /players/{playerId}/game/play:
    post:
      tags: [Game]
      summary: Play one round
      description: >
        The server draws one score from 300, 500, 1000 and 3000, adds it to the
        player's total (capped at 10000) and records it in the play history.
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      responses:
        "201":
          description: Round result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /players/{playerId}/rewards/{checkpoint}/claim:
    post:
      tags: [Game]
      summary: Claim the reward of a checkpoint
      parameters:
        - $ref: "#/components/parameters/PlayerId"
        - name: checkpoint
          in: path
          required: true
          schema:
            type: integer
            enum: [5000, 7500, 10000]
          example: 5000
      responses:
        "201":
          description: Reward claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResult"
        "400":
          description: Invalid checkpoint, or the score has not reached it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This checkpoint was already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /players/{playerId}/reset:
    post:
      tags: [Game]
      summary: Reset the player's score and histories
      description: Deletes the player and its histories. Safe to call repeatedly.
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      responses:
        "204":
          description: Reset done
        "400":
          $ref: "#/components/responses/BadRequest"
  /players/{playerId}/history/plays:
    get:
      tags: [History]
      summary: Latest 100 play results, newest first
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      responses:
        "200":
          description: Play history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayHistoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
  /players/{playerId}/history/rewards:
    get:
      tags: [History]
      summary: Claimed rewards, newest first
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      responses:
        "200":
          description: Reward history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RewardHistoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  parameters:
    PlayerId:
      name: playerId
      in: path
      required: true
      description: UUID generated by the client
      schema:
        type: string
        format: uuid
      example: 11111111-1111-4111-8111-111111111111
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        statusCode: { type: integer, example: 400 }
        message:
          type: array
          items: { type: string }
          example: ["playerId must be a UUID"]
        path: { type: string }
        timestamp: { type: string, format: date-time }
    PlayResult:
      type: object
      properties:
        score: { type: integer, enum: [300, 500, 1000, 3000], example: 500 }
        totalScore: { type: integer, example: 500 }
    Checkpoint:
      type: object
      properties:
        points: { type: integer, example: 5000 }
        reward: { type: string, example: "รางวัล A" }
        status: { type: string, enum: [locked, claimable, claimed] }
    PlayerSummary:
      type: object
      properties:
        totalScore: { type: integer, example: 6000 }
        maxScore: { type: integer, example: 10000 }
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/Checkpoint"
    ClaimResult:
      type: object
      properties:
        checkpoint: { type: integer, example: 5000 }
        reward: { type: string, example: "รางวัล A" }
        claimedAt: { type: string, format: date-time }
    PlayHistoryItem:
      type: object
      properties:
        id: { type: integer }
        score: { type: integer, example: 1000 }
        createdAt: { type: string, format: date-time }
    RewardHistoryItem:
      type: object
      properties:
        id: { type: integer }
        checkpoint: { type: integer, example: 5000 }
        rewardName: { type: string, example: "รางวัล A" }
        createdAt: { type: string, format: date-time }
